name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq bubblewrap
      - name: Shellcheck
        run: |
          shellcheck -S warning install.sh \
            skills/opencode-local-subagent/scripts/*.sh \
            tests/run_tests.sh tests/live/*.sh tests/stub/opencode tests/stub/lms tests/stub/ssh \
            tests/spikes/s27_project_plugin.sh
      - name: Deterministic tests
        # Linux sandbox (bubblewrap): required when this runner allows unprivileged user namespaces (Ubuntu's
        # AppArmor can block them: try the documented sysctl first); otherwise say why and run without it.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          if bwrap --ro-bind / / --dev /dev --proc /proc true; then
            OCLS_REQUIRE_SANDBOX=1 bash tests/run_tests.sh
          else
            echo "::warning::bwrap does not work on this runner (see the error above); running without the sandbox tests"
            bash tests/run_tests.sh
          fi

  test-macos:
    # the OS sandbox (sandbox-exec) only exists on macOS; fail rather than skip its tests.
    # Intel image: GitHub's arm64 macOS pool (macos-latest) is short on capacity, and most jobs there were
    # cancelled after 15 min with "not acquired by Runner". sandbox-exec behaves the same on Intel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: command -v jq || brew install jq
      - name: Deterministic tests (incl. sandbox)
        env:
          OCLS_REQUIRE_SANDBOX: "1"
        run: bash tests/run_tests.sh
