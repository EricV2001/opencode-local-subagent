name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Shellcheck
        run: |
          shellcheck -S warning install.sh \
            skills/opencode-local-subagent/scripts/*.sh \
            tests/run_tests.sh tests/live/*.sh tests/stub/opencode tests/stub/lms
      - name: Deterministic tests
        run: bash tests/run_tests.sh
